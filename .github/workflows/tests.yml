name: Tests
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.6 'mypy>=1.18,<3'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
  installed-wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - if: runner.os != 'macOS'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install the built wheel
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          wheel, = pathlib.Path('dist').glob('*.whl')
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel) + '[visualization]', 'pytest', 'pytest-cov'], check=True)
          PY
      - name: Verify installed artifact and run outside checkout
        run: python -I tools/check_installed.py --dist dist --output installed-wheel-report.json --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: installed-wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            installed-wheel-report.json
            installed-wheel-report.xml

  native-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: wjq-learning/CBraMod
          ref: b9e961003214326972c567eff390e75b0287e32a
          path: external/CBraMod
      - uses: actions/checkout@v7
        with:
          repository: 935963004/LaBraM
          ref: c431221e6cfd23dbfa9950e0180682fb322b0548
          path: external/LaBraM
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev,labram]'
      - run: pytest -m native
        env:
          EEGLENS_CBRAMOD_SOURCE: ${{ github.workspace }}/external/CBraMod
          EEGLENS_LABRAM_SOURCE: ${{ github.workspace }}/external/LaBraM

  optional-aperiodic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev,aperiodic]'
      - run: pytest -q tests/test_aperiodic_optional.py

  native-catalog:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: eegpt
            repository: BINE022/EEGPT
            revision: a0e0a8fad729e2ecf4eedb3a81548a6e6d48a705
            dependencies: ''
          - model: csbrain
            repository: yuchen2199/CSBrain
            revision: 185aee55b24d0410a830df8dd08d03f675616998
            dependencies: matplotlib einops threadpoolctl
          - model: steegformer
            repository: LiuyinYang1101/STEEGFormer
            revision: 542ee17918c3c2c36ba1d4ea02bedff5eb149370
            dependencies: timm
          - model: diver
            repository: DIVER-Project/DIVER-1
            revision: fae4d7c5a58f2f795ce767939ad191d9c7ba49b8
            dependencies: mup jaxtyping einops
          - model: biot
            repository: ycq091044/BIOT
            revision: d138e32634e52ae9fa6ec98ac9c4087b14ca869a
            dependencies: linear-attention-transformer einops
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: external/native
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev]' ${{ matrix.dependencies }}
      - run: pytest -q tests/test_native_catalog.py
        env:
          EEGLENS_NATIVE_MODEL: ${{ matrix.model }}
          EEGLENS_NATIVE_SOURCE: ${{ github.workspace }}/external/native
