name: Tests
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.6
      - run: ruff check .
      - run: ruff format --check .
  installed-wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - if: runner.os != 'macOS'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install the built wheel
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          wheel, = pathlib.Path('dist').glob('*.whl')
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel), 'pytest', 'pytest-cov'], check=True)
          PY
      - name: Verify installed artifact and run outside checkout
        run: python -I tools/check_installed.py --dist dist --output installed-wheel-report.json --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: installed-wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            installed-wheel-report.json
            installed-wheel-report.xml

  native-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wjq-learning/CBraMod
          ref: b9e961003214326972c567eff390e75b0287e32a
          path: external/CBraMod
      - uses: actions/checkout@v4
        with:
          repository: 935963004/LaBraM
          ref: c431221e6cfd23dbfa9950e0180682fb322b0548
          path: external/LaBraM
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev,labram]'
      - run: pytest -m native
        env:
          EEGLENS_CBRAMOD_SOURCE: ${{ github.workspace }}/external/CBraMod
          EEGLENS_LABRAM_SOURCE: ${{ github.workspace }}/external/LaBraM
