[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eeglens"
version = "0.1.0a9"
description = "Observe and intervene on EEG foundation models with explicit tensor semantics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["torch>=2.6", "numpy>=1.26"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
eeg = ["mne>=1.6"]
labram = ["timm>=0.4.12", "einops>=0.7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/eeglens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires explicitly supplied checkpoint or EEG data"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/eeglens/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
